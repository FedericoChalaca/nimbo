<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nimbo</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; media-src 'self' blob: mediastream:; connect-src 'self' blob: https://huggingface.co https://*.huggingface.co https://*.hf.co">
<style>
  :root { --ink: #2b2d42; --cheek: #ff9bb3; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }

  /* Color de cada estado: brillo de la isla, aura del personaje, insignia y puntitos */
  #nimbo { position: relative; width: 440px; height: 480px; --sc: #8a8f98; --cloud2: #dfe3f2;
    --accent-a: #9d95ff; --accent-b: #ffffff; }
  #nimbo.state-thinking { --sc: #9b87ff; --cloud2: #ddd6ff; }
  #nimbo.state-working { --sc: #4da3ff; --cloud2: #d2e4ff; }
  #nimbo.state-needs { --sc: #ffb020; --cloud2: #ffe3a6; }
  #nimbo.state-finished { --sc: #34c77b; --cloud2: #c8f1da; }
  #nimbo.state-error { --sc: #e5484d; --cloud2: #c3c6d2; }
  #nimbo.state-listening { --sc: #ff6b9a; --cloud2: #ffd9e6; }
  #nimbo.state-sleeping { --sc: #5b6170; --cloud2: #d4d7e2; }
  #nimbo.theme-jarvis { --accent-a: #ff8c1a; --accent-b: #ffe0a0; }

  /* ── La isla ──────────────────────────────────────────────────────────────
     Cuelga del borde de arriba. Crece con rebote (resorte) y encoge rápido sin
     rebote (.closing): misma asimetría que usan las islas de referencia. */
  #wrap { position: absolute; top: 0; left: calc(14px + var(--f, .5) * (100% - 28px)); transform: translateX(calc(var(--f, .5) * -100%));
    width: var(--w, 112px); height: var(--h, 52px);
    transition: width .52s cubic-bezier(.32, 1.22, .42, 1), height .52s cubic-bezier(.32, 1.22, .42, 1),
      transform .75s cubic-bezier(.34, 1.56, .64, 1); }
  #wrap.closing { transition: width .34s cubic-bezier(.45, 0, .2, 1), height .34s cubic-bezier(.45, 0, .2, 1),
      transform .75s cubic-bezier(.34, 1.56, .64, 1); }
  .enter #wrap { transform: translate(calc(var(--f, .5) * -100%), -120%); }
  /* Esquinas invertidas: la isla se funde con el borde de arriba como un notch */
  .ear { position: absolute; top: 0; width: 14px; height: 14px; }
  .ear.l { left: -14px; background: radial-gradient(circle at 0 100%, transparent 13.5px, #000 14px); }
  .ear.r { right: -14px; background: radial-gradient(circle at 100% 100%, transparent 13.5px, #000 14px); }
  /* clip y no hidden: con hidden, al enfocar el campo del chat el navegador desplazaba la isla
     hacia arriba y la nube desaparecía */
  #island { position: absolute; inset: 0; overflow: clip; background: #000; color: #eceef2; font-size: 12.5px;
    border-radius: 0 0 22px 22px; box-shadow: 0 16px 36px rgba(0, 0, 0, .42);
    transition: border-radius .4s; }
  .open #island { border-radius: 0 0 28px 28px; }
  /* Brillo del estado que sube desde abajo de la isla */
  #island::before { content: ""; position: absolute; left: -15%; right: -15%; bottom: -50px; height: 100px;
    background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--sc) 55%, transparent), transparent 70%);
    opacity: 0; transition: opacity .6s; pointer-events: none; }
  #nimbo:is(.state-thinking, .state-working, .state-needs, .state-finished, .state-error, .state-listening) #island::before { opacity: .45; }
  .open #island::before { opacity: .3 !important; }

  /* Fila de arriba: personaje · texto · puntitos de chats */
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 68px; display: flex; align-items: center;
    gap: 10px; padding: 0 16px 0 116px; box-sizing: border-box; }
  /* El texto que cambia: el viejo sube y se apaga, el nuevo entra desde abajo (máscara en los bordes) */
  #ticker { position: relative; flex: 1; min-width: 0; height: 20px; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent 0%, #000 22%, #000 78%, transparent 100%); }
  #ticker span { position: absolute; left: 0; top: 0; max-width: 100%; line-height: 20px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: #e9eaee; font-size: 13.5px; }
  #label { opacity: 0; transition: opacity .3s; }
  .open #ticker:not(:has(#label.show))::after { content: var(--t-ask, "¿En qué te ayudo?"); color: #6b717a; line-height: 20px; }
  #label.show { opacity: 1; }
  .state-sleeping #label { opacity: 0; }
  /* Brillo que recorre el texto mientras Claude piensa o trabaja */
  #nimbo:is(.state-working, .state-thinking) #label {
    background: linear-gradient(100deg, #7c818a 0 38%, #f2f3f5 50%, #7c818a 62% 100%) 0 0 / 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 2.2s linear infinite; }
  @keyframes shine { from { background-position: 130% 0; } to { background-position: -130% 0; } }
  #measure { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: nowrap; font-weight: 500;
    font-size: 13.5px; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  /* Botón de WhatsApp en la barra: chats sin leer; late mientras se resume; rojo si hay algo urgente */
  #waBtn { flex: none; position: relative; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: #25d366; color: #05270f;
    font: 800 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; animation: pop-in .45s cubic-bezier(.3, 1.7, .5, 1) both; }
  #waBtn:hover { filter: brightness(1.15); }
  #waBtn.urgent { background: #ff4d4f; color: #fff; }
  #waBtn.busy::after { content: ""; position: absolute; inset: -4px; border-radius: 999px; border: 2px solid transparent;
    border-top-color: #25d366; border-right-color: #25d366; animation: spin .8s linear infinite; }
  #waBtn.urgent.busy::after { border-top-color: #ff4d4f; border-right-color: #ff4d4f; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .afoot.row { display: flex; align-items: center; gap: 6px; }
  .afoot.row button { padding: 3px 10px; font-size: 11px; }
  .afoot.row button:first-of-type { margin-left: auto; }
  .ahead button + button { margin-left: 6px; }
  /* Respuesta sugerida, debajo de su chat */
  .areply { display: flex; align-items: center; gap: 8px; margin: -3px 6px 5px 12px; padding-left: 10px; border-left: 2px solid rgba(37, 211, 102, .45);
    font-size: 12px; color: #c9cdd6; }
  .areply span { flex: 1; min-width: 0; user-select: text; }
  .areply button { flex: none; padding: 3px 10px; font-size: 11px; }
  #pips { display: flex; gap: 5px; flex: none; }
  #pips:empty { display: none; }
  .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #888);
    animation: pop-in .45s cubic-bezier(.3, 1.7, .5, 1) both; }
  .pip.working, .pip.thinking { animation: pop-in .45s cubic-bezier(.3, 1.7, .5, 1) both, pulse 1.2s ease-in-out .45s infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.75); } }
  @keyframes pop-in { from { transform: scale(0); } }

  /* ── Personaje ── (viaja y cambia de tamaño con su propio resorte) */
  #char { position: absolute; left: 0; top: -1px; width: 120px; height: 70px;
    transition: left .52s cubic-bezier(.32, 1.22, .42, 1), top .52s cubic-bezier(.32, 1.22, .42, 1),
      width .52s cubic-bezier(.32, 1.22, .42, 1), height .52s cubic-bezier(.32, 1.22, .42, 1); }
  /* Aura del color del estado detrás del personaje (gradiente difuminado, más barato que drop-shadow) */
  #glow { position: absolute; left: 22%; top: 2%; width: 56%; height: 96%; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--sc) 80%, transparent) 0%, transparent 62%);
    filter: blur(6px); opacity: .65; transition: opacity .4s, background .4s; }
  #nimbo:is(.state-idle, .state-sleeping) #glow { opacity: .15; }
  .theme-jarvis #glow { display: none; }
  /* Sin texto ni puntitos: el personaje va centrado (su centro está al 46 % del ancho) */
  .solo #char { left: calc(50% - 55px); }
  #char svg, #orb { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #hit { pointer-events: all; cursor: pointer; }
  .theme-cloud #orb { display: none; }
  .theme-jarvis #char svg > :not(#hit) { display: none; }
  /* Insignia de estado (… ! ✓ ✕): el cambio se anima desde JS (encoge, cambia, rebota) */
  /* En % para que acompañe a la nube cuando crece (modo soltar) */
  #badge { position: absolute; left: 18%; top: 6%; width: 14px; height: 14px; border-radius: 50%; box-sizing: content-box;
    background: var(--sc); border: 2px solid #000; color: #000; font: 800 9px/14px "Segoe UI", sans-serif;
    text-align: center; transform: scale(0); transition: transform .28s cubic-bezier(.3, 1.7, .5, 1), background .3s; }
  #nimbo:is(.state-thinking, .state-working, .state-needs, .state-finished, .state-error) #badge { transform: scale(1); }
  .state-thinking #badge::after, .state-working #badge::after { content: "•••"; letter-spacing: -1px; font-size: 7px; }
  .state-needs #badge::after { content: "!"; }
  .state-finished #badge::after { content: "✓"; }
  .state-error #badge::after { content: "✕"; }

  /* Cuerpo de la nube: brillante arriba, teñido del color del estado abajo, con brillo especular */
  #body { fill: url(#cloudShade); }
  #cloudShade .top { stop-color: #ffffff; }
  #cloudShade .bottom { stop-color: var(--cloud2); transition: stop-color .5s; }
  #gloss { fill: url(#cloudGloss); pointer-events: none; }
  #breathe { transform-origin: 120px 96px; animation: breathe 3.6s ease-in-out infinite; }
  .state-sleeping #breathe { animation-duration: 5.5s; }
  /* Respirar conservando el volumen: cuando sube, adelgaza */
  @keyframes breathe { 50% { transform: scale(.985, 1.03); } }
  #bob { transform-origin: 120px 96px; }
  .state-working #bob { animation: bob .9s ease-in-out infinite; }
  .state-thinking #bob { animation: bob 2.2s ease-in-out infinite; }
  .state-needs #bob { animation: hop .6s cubic-bezier(.3, 0, .7, 1) infinite; }
  .state-finished #bob { animation: jump .9s ease-out; }
  .state-error #bob { animation: shake .28s linear; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @keyframes hop { 50% { transform: translateY(-7px) scale(.97, 1.03); } }
  /* Salto: aplasta, se estira en el aire, aplasta al caer y se asienta */
  @keyframes jump { 15% { transform: scale(1.08, .9); } 40% { transform: translateY(-20px) scale(.94, 1.08); }
    65% { transform: translateY(0) scale(1.08, .9); } 82% { transform: translateY(-4px) scale(.98, 1.02); } }
  /* Sacudida de error: +8 % / −8 % / +5 % / 0 en 280 ms */
  @keyframes shake { 18% { transform: translateX(10px); } 43% { transform: translateX(-10px); }
    68% { transform: translateX(6px); } }
  #squish { transform-origin: 120px 96px; }
  /* Clic: aplasta (70 ms), estira (130 ms) y vuelve (170 ms), siempre en contrafase */
  .poke #squish { animation: squish .37s linear; }
  @keyframes squish { 0% { transform: scale(1, 1); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    19% { transform: scale(1.16, .78); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    54% { transform: scale(.95, 1.1); animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
    100% { transform: scale(1, 1); } }

  /* Cara: cada variante se enciende según el estado */
  .v { display: none; }
  #look { transition: transform .17s ease-out; }
  .eye { transform-box: fill-box; transform-origin: center; }
  .line { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
  .cheek { fill: var(--cheek); opacity: .45; transition: opacity .3s; }
  .state-error .cheek { opacity: 0; }
  .emote-love .cheek, .hovering .cheek { opacity: .8; }

  .state-idle .eyes-open, .state-idle .m-smile,
  .state-thinking .eyes-open, .state-thinking .m-o, .state-thinking .dots,
  .state-working .eyes-open, .state-working .m-flat, .state-working .brows-focus,
  .state-needs .eyes-open, .state-needs .m-o,
  .state-finished .eyes-happy, .state-finished .m-big, .state-finished .sparkles,
  .state-error .eyes-x, .state-error .m-sad, .state-error .rain,
  .state-sleeping .eyes-closed, .state-sleeping .m-small, .state-sleeping .zzz { display: inline; }
  .state-listening .eyes-open, .state-listening .m-o { display: inline; }
  .state-listening #squish { transform: scale(calc(1 + var(--lvl, 0) * .08)); transition: transform .08s; }
  /* Ojos un poco más grandes al pasar el mouse o cuando te necesita */
  #eyesScale { transform-origin: 120px 64px; transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
  .hovering #eyesScale, .state-needs #eyesScale { transform: scale(1.12); }
  #nimbo.poke .face .v { display: none; }
  #nimbo.poke .eyes-happy, #nimbo.poke .m-big { display: inline; }

  /* Gestos: mandan sobre la cara del estado mientras duran */
  /* :where() para que esta regla pese lo mismo que las de abajo y ganen ellas (van después) */
  #nimbo:where([class*="emote-"], .drag-over, .dragging) .face .v { display: none; }
  #nimbo.emote-hello .eyes-happy, #nimbo.emote-hello .m-big,
  #nimbo.emote-love .eyes-happy, #nimbo.emote-love .m-smile, #nimbo.emote-love .hearts,
  #nimbo.emote-dizzy .eyes-dizzy, #nimbo.emote-dizzy .m-o,
  #nimbo.emote-yawn .eyes-closed, #nimbo.emote-yawn .m-o,
  #nimbo.emote-gulp .eyes-happy, #nimbo.emote-gulp .m-small,
  #nimbo.drag-over .eyes-open, #nimbo.drag-over .m-big,
  #nimbo.dragging .eyes-open, #nimbo.dragging .m-big { display: inline; }
  .emote-hello #bob { animation: jump .9s ease-out; }
  .emote-dizzy #squish { transform-origin: 120px 64px; animation: wobble .45s ease-in-out infinite; }
  @keyframes wobble { 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  .eyes-dizzy .spin { transform-box: fill-box; transform-origin: center; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Bostezo: se estira hacia arriba y abre la boca */
  .emote-yawn #squish { animation: stretch 1.4s ease-in-out; }
  @keyframes stretch { 35%, 70% { transform: scale(.94, 1.12); } }
  .emote-yawn .m-o { transform-box: fill-box; transform-origin: center; animation: yawn 1.4s ease-in-out; }
  @keyframes yawn { 40%, 70% { transform: scale(2.2, 2.6); } }
  /* Tragar: aplasta fuerte, estira y se asienta con rebote */
  .emote-gulp #squish { animation: gulp .6s linear; }
  @keyframes gulp { 0% { transform: scale(1, 1); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    20% { transform: scale(1.28, .78); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    55% { transform: scale(.92, 1.18); animation-timing-function: cubic-bezier(.3, 1.6, .5, 1); }
    100% { transform: scale(1, 1); } }
  .drag-over #squish { transform: scale(1.08); transition: transform .2s; }
  .hearts path { fill: #ff5c8a; transform-box: fill-box; transform-origin: center; opacity: 0; }
  .emote-love .hearts path { animation: float-up 1.5s ease-out both; }
  .emote-love .hearts path:nth-child(2) { animation-delay: .14s; }
  .emote-love .hearts path:nth-child(3) { animation-delay: .28s; }
  /* Partículas: aparecen en el primer 20 %, se apagan el resto y crecen un 40 % mientras suben */
  @keyframes float-up { 0% { opacity: 0; transform: translate(0, 6px) scale(.7) rotate(-8deg); }
    20% { opacity: 1; } 50% { transform: translate(3px, -8px) scale(.9) rotate(8deg); }
    100% { opacity: 0; transform: translate(-2px, -22px) scale(1) rotate(-6deg); } }

  /* Extras */
  .dots circle { fill: #fff; animation: dot 1.2s ease-in-out infinite; }
  .dots circle:nth-child(2) { animation-delay: .22s; }
  .dots circle:nth-child(3) { animation-delay: .44s; }
  @keyframes dot { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .dots circle { transform-box: fill-box; transform-origin: center; }
  /* Ojo: en SVG, display:none en el grupo NO detiene las animaciones de sus hijos; por eso las
     animaciones de una sola vez se activan con la clase del estado/gesto, no siempre. */
  .sparkles path { fill: #ffd23f; transform-box: fill-box; transform-origin: center; transform: scale(0); }
  .state-finished .sparkles path { animation: twinkle 1s ease-out both; }
  .state-finished .sparkles path:nth-child(2) { animation-delay: .14s; }
  .state-finished .sparkles path:nth-child(3) { animation-delay: .28s; }
  .state-finished .sparkles path:nth-child(4) { animation-delay: .42s; }
  @keyframes twinkle { 0% { transform: scale(0) rotate(0); } 40% { transform: scale(1.2) rotate(45deg); }
    100% { transform: scale(0) rotate(90deg); } }
  .rain line { stroke: #7aa7ff; stroke-width: 2.4; stroke-linecap: round; animation: fall .9s linear infinite; }
  .rain line:nth-child(2) { animation-delay: .3s; }
  .rain line:nth-child(3) { animation-delay: .6s; }
  .rain line:nth-child(4) { animation-delay: .15s; }
  @keyframes fall { from { transform: translateY(0); opacity: 1; } to { transform: translateY(26px); opacity: 0; } }
  .zzz text { fill: #c9ccd6; font: 700 13px "Segoe UI", sans-serif; opacity: 0; animation: zz 3s ease-out infinite; }
  .zzz text:nth-child(2) { animation-delay: 1s; }
  .zzz text:nth-child(3) { animation-delay: 2s; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: .8; }
    100% { opacity: 0; transform: translate(14px, -16px); } }

  /* ── Contenido de la isla abierta: tarjetas ──
     Entran después de que la caja crece: desenfocadas → nítidas, con escala .97 → 1 y
     un desfase de 35 ms entre una y otra. */
  #content { position: absolute; top: 70px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; }
  .box { position: relative; overflow: hidden; box-sizing: border-box; padding: 12px 14px; border-radius: 18px;
    background: #16171a; border: 1px solid rgba(255, 255, 255, .06); color: #eceef2; font-size: 12.5px;
    animation: focus-in .32s cubic-bezier(.3, 1.2, .4, 1) .16s both; }
  .box:nth-child(2) { animation-delay: .195s; }
  .box:nth-child(3) { animation-delay: .23s; }
  .box:nth-child(4) { animation-delay: .265s; }
  @keyframes focus-in { from { opacity: 0; transform: scale(.97); filter: blur(8px); } }
  /* Brillo del estado al pie de cada tarjeta */
  .box::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70%; pointer-events: none;
    background: linear-gradient(to top, color-mix(in srgb, var(--sc) 16%, transparent), transparent); }
  .box > * { position: relative; z-index: 1; }
  .what { display: flex; align-items: center; gap: 7px; color: #9aa0a8; font-size: 12px; margin-bottom: 8px; }
  .what::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sc); flex: none; }
  .what b { color: #f2f3f5; font-weight: 600; }
  .cmd { font: 12.5px "Cascadia Mono", Consolas, monospace; word-break: break-all; background: #0b0c0e;
    border: 1px solid rgba(255, 255, 255, .07); padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; max-height: 170px; overflow: auto; user-select: text;
    scrollbar-width: thin; scrollbar-color: #4a4d55 transparent; }
  #alwaysRules { margin-top: 8px; color: #8f959e; font-size: 11px; word-break: break-all; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button { border: 0; border-radius: 999px; padding: 7px 15px; color: #eceef2; cursor: pointer; background: #2a2c31;
    font: 600 12px "Segoe UI Variable Text", "Segoe UI", sans-serif;
    transition: background .2s, transform .2s cubic-bezier(.3, 1.6, .5, 1); }
  button:hover { background: #35373d; transform: scale(1.04); }
  button:active { transform: scale(.95); transition-duration: .08s; }
  button.allow { background: #f5f6f8; color: #0b0c0e; margin-left: auto; }
  button.allow:hover { background: #ffffff; }
  #chat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; }
  #thumbs { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 5px; }
  #thumbs:empty { display: none; }
  #thumbs img { width: 42px; height: 42px; object-fit: cover; border-radius: 8px; cursor: pointer;
    outline: 1px solid rgba(255, 255, 255, .2); }
  #thumbs img:hover { opacity: .5; }
  #chat input { flex: 1; min-width: 0; height: 32px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, .07);
    outline: none; border-radius: 999px; padding: 0 13px; color: #eceef2; background: #0b0c0e;
    font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif; transition: border-color .2s; }
  #chat input:focus { border-color: color-mix(in srgb, var(--accent-a) 60%, transparent); }
  #chat button { flex: 0 0 32px; height: 32px; padding: 0; font-family: "Segoe UI Emoji", sans-serif; font-size: 14px; }
  #chat button[type="submit"] { background: #f5f6f8; color: #0b0c0e; }
  #chat button.live { background: #e5484d; animation: live 1s ease-in-out infinite; }
  @keyframes live { 50% { box-shadow: 0 0 0 4px rgba(229, 72, 77, .35); } }
  .prop { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, .08); white-space: normal; }

    background: #0b0c0e; font: 12.5px "Segoe UI Variable Text", "Segoe UI", sans-serif; }

  /* Chats activos (al pasar el mouse) */
  #sessions { padding: 10px 10px 8px; }
  #sessions .head { color: #8f959e; font-size: 11px; margin: 0 4px 4px; }
  .srow { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 9px; font-size: 12.5px; }

  .srow .step { flex: 1; min-width: 0; color: #9aa0a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .ago { color: #6b717a; font-size: 11px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #888; }
  .dot.working { background: #4da3ff; animation: pulse 1.2s ease-in-out infinite; }
  .dot.thinking { background: #9b87ff; animation: pulse 1.6s ease-in-out infinite; }
  .dot.needs { background: #ffb020; }
  .dot.finished { background: #34c77b; }
  .dot.error { background: #e5484d; }

  /* Archivos adjuntos */
  .chip { display: inline-flex; align-items: center; gap: 4px; max-width: 150px; height: 26px; padding: 0 9px;

  .chip:hover { opacity: .6; }

  /* Respuesta con barra de desplazamiento propia (la nativa no se puede animar) */
  #answerBox { padding-right: 20px; }
  #answer { max-height: 230px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; user-select: text; scrollbar-width: none; }
  #answer::-webkit-scrollbar { display: none; }
  #answer.wait { color: #9aa0a8; font-style: italic; }
  #rail { position: absolute; right: 7px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; z-index: 2;
    background: rgba(255, 255, 255, .07); opacity: 0; transition: opacity .3s, width .2s; }
  #rail.on { opacity: 1; }
  #answerBox:hover #rail { width: 5px; }
  #thumb { position: absolute; left: 0; right: 0; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b), var(--accent-a)) 0 0 / 100% 200%;
    box-shadow: 0 0 8px var(--accent-a); animation: shimmer 1.6s linear infinite;
    transition: top .12s ease-out, height .2s ease-out; }
  @keyframes shimmer { to { background-position: 0 200%; } }

  /* Modo mini: solo el personaje en la esquina */
  #nimbo.mini { width: 100px; height: 60px; }
  .mini #wrap { left: 0; transform: none; width: 100px !important; height: 60px !important; transition: none; }
  .mini #island { background: transparent; box-shadow: none; border-radius: 0; }
  .mini .ear, .mini #island::before, .mini #bar, .mini #content { display: none; }
  .mini #char { left: 0; top: 2px; width: 100px; height: 58px; }

  /* "Siempre" va pegado a "Permitir", los dos a la derecha */
  #always { margin-left: auto; }
  #always:not(.hidden) + .allow { margin-left: 0; }

  /* Recordatorio */
  .rtext { font-size: 15px; font-weight: 600; color: #f2f3f5; line-height: 1.35; }
  .rdue { color: #9aa0a8; font-size: 12px; margin-top: 3px; }
  .dot.pending { background: #ffd23f; }

  /* Progreso mientras Claude responde: avanza rápido, se frena cerca del final y
     termina en verde cuando llega la respuesta */
  #progress { position: absolute; left: 116px; right: 16px; bottom: 5px; height: 3px; border-radius: 3px;
    background: rgba(255, 255, 255, .07); opacity: 0; transition: opacity .35s; pointer-events: none; }
  #progress.on { opacity: 1; }
  #progress i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); border-radius: 3px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent-a) 25%, transparent), var(--accent-a));
    box-shadow: 0 0 8px var(--accent-a); transition: width .2s linear, background .3s; }
  #progress i::after { content: ""; position: absolute; right: -3px; top: -2px; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px 2px var(--accent-a); }
  #progress.done i { background: #34c77b; box-shadow: 0 0 10px #34c77b; }
  #progress.done i::after { box-shadow: 0 0 12px 3px #34c77b; }

  /* Arrastrando archivos encima: aro que respira alrededor de la isla */
  .drag-over #island { animation: ring 1s ease-in-out infinite; }
  @keyframes ring { 50% { box-shadow: 0 16px 36px rgba(0, 0, 0, .42), inset 0 0 0 1.5px color-mix(in srgb, var(--accent-a) 80%, transparent); } }
  .drag-over #char { transition: left .25s cubic-bezier(.3, 1.4, .5, 1); }
  /* Masticar después de tragar: 3 mordiscos de 140 ms */
  .chew #squish { animation: chew .14s ease-in-out 3; }
  @keyframes chew { 50% { transform: scale(1.03, .93); } }
  /* El archivo que vuela hacia la boca */
  .flyer { position: fixed; left: 0; top: 0; z-index: 10; display: flex; align-items: center; gap: 5px; max-width: 150px;
    padding: 6px 9px; border-radius: 10px; background: #f5f6f8; color: #0b0c0e; font: 600 11px "Segoe UI", sans-serif;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .45); pointer-events: none; white-space: nowrap; transform-origin: 50% 50%; }
  .flyer img { width: 28px; height: 28px; object-fit: cover; border-radius: 5px; }
  .flyer span { overflow: hidden; text-overflow: ellipsis; }

  /* Vista en vivo: pasos del chat activo y lo que está tocando (diff / terminal) */
  #live { padding: 12px 14px 12px; }
  .lhead { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .lhead b { font-weight: 600; color: #f2f3f5; }
  .lhead .sub { color: #8f959e; }
  .lhead .count { margin-left: auto; color: #6b717a; font-size: 11px; }
  .steps { display: flex; flex-direction: column; gap: 3px; }
  .lstep { display: flex; gap: 8px; align-items: center; color: #8f959e; font-size: 12px; min-width: 0; }
  .lstep span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lstep.run { color: #f2f3f5; }
  .lstep i { width: 12px; flex: none; text-align: center; font-style: normal; font-size: 11px; }
  .lstep.ok i::before { content: "✓"; color: #34c77b; }
  .lstep.fail i::before { content: "✕"; color: #e5484d; }
  .lstep.run i::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid #4da3ff; border-right-color: transparent; animation: spin .8s linear infinite; }
  .code { margin-top: 9px; background: #0b0c0e; border: 1px solid rgba(255, 255, 255, .07); border-radius: 10px;
    overflow: hidden; font: 11.5px/1.6 "Cascadia Mono", Consolas, monospace; }
  .code .tab { display: flex; gap: 6px; align-items: center; padding: 4px 10px; background: #121316; color: #c9ccd3;
    font: 600 11px "Segoe UI", sans-serif; border-bottom: 1px solid rgba(255, 255, 255, .05); }
  .code .tab em { margin-left: auto; color: #6b717a; font-style: normal; font-weight: 400; }
  .ln { padding: 0 10px; white-space: pre; overflow: hidden; text-overflow: ellipsis; color: #b8bcc5; }
  .ln.del { background: rgba(229, 72, 77, .13); color: #e98a8d; text-decoration: line-through; text-decoration-color: rgba(233, 138, 141, .55); }
  /* Las líneas nuevas aparecen como si se tecleara, una tras otra */
  .ln.add { background: rgba(52, 199, 123, .12); color: #8fe0b2;
    animation: type .5s steps(26) both; animation-delay: calc(.25s + var(--i, 0) * .12s); }
  .ln.cmd { color: #f2f3f5; }
  .ln.out { color: #8f959e; }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  /* Modo "suéltalo aquí": la isla entera es la zona; el personaje crece, sigue al cursor y
     abre la boca "masticando en el aire". Todo lo demás se esconde. */
  .dropping #content, .dropping #bar { display: none; }
  .dropping #char { top: 14px; width: 190px; height: 110.8px;
    transition: left .3s cubic-bezier(.3, 1.4, .5, 1), top .45s cubic-bezier(.32, 1.22, .42, 1),
      width .45s cubic-bezier(.32, 1.22, .42, 1), height .45s cubic-bezier(.32, 1.22, .42, 1); }
  .dropping .m-big { transform-box: fill-box; transform-origin: center top; animation: chomp .8s ease-in-out infinite; }
  @keyframes chomp { 50% { transform: scale(1.4, 1.7); } }
  #dropzone { position: absolute; inset: 8px; border-radius: 22px; pointer-events: none; opacity: 0;

    text-align: center; color: #9aa0a8; font-size: 12px; }
  .dropping #dropzone { opacity: 1; }

  /* Píldoras por app, cada una con su mini nube de color */
  #apps { display: flex; flex-wrap: wrap; gap: 7px; padding: 9px 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 13%, #1d1e22); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);

  .pill:nth-child(2) .mini { animation-delay: -.9s; }

  @keyframes mini-bob { 50% { transform: translateY(-1.5px) scale(1.04, .97); } }

  #appview { --sc: var(--c); padding: 12px 14px 10px; }
  .ahead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ahead .mini { width: 26px; height: 18px; }
  .ahead b { color: #f2f3f5; font-weight: 600; }
  .ahead .sub { color: #8f959e; }
  .ahead button { margin-left: auto; padding: 4px 10px; font-size: 11px; }
  .arow { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 9px; font-size: 12.5px; }
  .arow.link { cursor: pointer; }
  .arow.link:hover { background: rgba(255, 255, 255, .05); }
  .arow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eceef2; }
  .chip2 { flex: none; padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 600;
    background: rgba(255, 255, 255, .07); color: #b8bcc5; }
  .chip2.blue { background: rgba(87, 157, 255, .16); color: #8fbcff; }
  .chip2.purple { background: rgba(155, 135, 255, .16); color: #c2b5ff; }
  .chip2.red { background: rgba(229, 72, 77, .16); color: #ff9a9d; }
  .chip2.amber { background: rgba(255, 176, 32, .16); color: #ffcc70; }
  .arow .done { margin-left: 2px; padding: 2px 8px; font-size: 11px; }
  .afoot { margin-top: 6px; color: #6b717a; font-size: 11px; }
  /* Conexiones y ajustes */
  #setup { padding: 12px 14px 12px; }
  .crow { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-top: 1px solid rgba(255, 255, 255, .06); }
  .cdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #5b6170; }
  .cdot.on { background: #34c77b; box-shadow: 0 0 8px rgba(52, 199, 123, .8); }
  .cdot.off { background: #ffb020; }
  .cinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .cinfo b { font-weight: 600; color: #f2f3f5; }
  .cinfo span { color: #9aa0a8; font-size: 11.5px; line-height: 1.3; }
  .cinfo code { font: 11px "Cascadia Mono", Consolas, monospace; color: #cfd3dc; background: #0b0c0e; padding: 0 4px; border-radius: 4px; user-select: text; }
  .crow button { flex: none; padding: 5px 11px; font-size: 11.5px; }
  .crow input { flex: none; width: 118px; box-sizing: border-box; padding: 5px 10px; border-radius: 999px; background: #0b0c0e; color: #eceef2;
    border: 1px solid rgba(255, 255, 255, .1); outline: none; font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  .crow input:focus { border-color: color-mix(in srgb, var(--accent-a) 60%, transparent); }
  .chip2.green { background: rgba(37, 211, 102, .16); color: #7ee2a8; }
  .arow .name b { font-weight: 600; margin-right: 6px; }
  .arow .name i { font-style: normal; color: #a4a9b2; }
  .arow.urgent { background: rgba(229, 72, 77, .1); }
  /* Mensaje urgente de WhatsApp: todo se pone rojo y la isla late hasta que pasa la alarma */
  #nimbo.wa-urgent { --sc: #ff4d4f; }
  .wa-urgent #island { animation: alarm .7s ease-in-out infinite; }
  .wa-urgent #island::before { opacity: .8 !important; }
  .wa-urgent #char { animation: alarm-shake .35s ease-in-out infinite; }
  @keyframes alarm { 50% { box-shadow: 0 16px 36px rgba(0, 0, 0, .42), 0 0 26px rgba(255, 77, 79, .55), inset 0 0 0 2px #ff4d4f; } }
  @keyframes alarm-shake { 25% { transform: translateX(-2px) rotate(-3deg); } 75% { transform: translateX(2px) rotate(3deg); } }

  /* Arrastrando a Nimbo: se levanta, pone cara de emoción y se inclina según la velocidad */
  #wrap { cursor: grab; }
  #content, #content * { cursor: auto; }
  #content button, #content .link, #content .pill { cursor: pointer; }
  .dragging #wrap { cursor: grabbing; transition: none; }
  .dragging #island { box-shadow: 0 22px 44px rgba(0, 0, 0, .55), 0 0 0 1.5px color-mix(in srgb, var(--accent-a) 55%, transparent); }
  .dragging #char { transition: none; transform: rotate(var(--lean, 0deg)); transform-origin: 50% 0; }
  .dragging #content { opacity: .35; }
  /* Estela que queda detrás al moverse */
  #island::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; right: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(var(--trail-dir, 90deg), transparent 55%, color-mix(in srgb, var(--accent-a) 35%, transparent));
    transition: opacity .25s; }
  .dragging #island::after { opacity: var(--trail, 0); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>

<script src="jarvis.js"></script>
<script src="i18n.js"></script>
<script>
// Sin Electron (vista previa en un navegador) la página funciona igual, solo que sin eventos.
const noop = () => {};
const api = window.nimbo ?? new Proxy({}, { get: () => noop });
// Idioma: main.js lo pasa en la URL (?lang=en). El texto en español es la clave; i18n.js trae
// el inglés. t("Hola 👋 · {0}", quien) → traduce y pone los valores.
const LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
const LOCALE = LANG === "en" ? "en-US" : "es-CO";
const t = translator(LANG);
const root = document.getElementById("nimbo");
// Lo que está escrito en el HTML (botones, títulos, texto de ayuda) se traduce al cargar.
if (LANG === "en") {
  document.documentElement.lang = "en";
  for (const e of document.querySelectorAll("#content *")) {
    if (!e.children.length && e.textContent.trim()) e.textContent = t(e.textContent.trim());
    for (const a of ["title", "placeholder"]) if (e.hasAttribute(a)) e.setAttribute(a, t(e.getAttribute(a)));
  }
}
// Los dos textos que pinta el CSS (content:) llegan como variables.
root.style.setProperty("--t-ask", JSON.stringify(t("¿En qué te ayudo?")));
root.style.setProperty("--t-drop", JSON.stringify(t("Suéltalo sobre mí")));
const look = document.getElementById("look");
const label = document.getElementById("label");
const svg = document.querySelector("#char svg");
const wrap = document.getElementById("wrap");
const content = document.getElementById("content");
const pips = document.getElementById("pips");
const waBtn = document.getElementById("waBtn");
const measure = document.getElementById("measure");
const badge = document.getElementById("badge");

// --- Tamaño de la isla ---
// Compacta: se ajusta al largo del texto (como una "isla dinámica"). Abierta: crece hasta el
// contenido. Crecer usa resorte con rebote; encoger, la clase .closing (rápido, sin rebote).
const BAR_H = 68;
// La ventana mide 440 y a cada lado de la isla va una esquina invertida de 14: más ancha que
// esto, la ventana la recorta y pierde las curvas.
const MAX_W = 412;
let lastSize = { w: 0, h: 0 };
function layout() {
  layoutQueued = 0;
  if (mini) return;
  if (root.classList.contains("dropping")) {
    root.classList.remove("open", "solo");
    wrap.classList.remove("closing");
    wrap.style.setProperty("--w", `${MAX_W}px`);
    wrap.style.setProperty("--h", "152px");
    lastSize = { w: MAX_W, h: 152 };
    return;
  }
  const open = [...content.children].some((e) => !e.classList.contains("hidden"));
  root.classList.toggle("open", open);
  if (open) root.classList.remove("solo");
  let w, h;
  if (open) {
    w = MAX_W;
    h = Math.min(470, BAR_H + content.offsetHeight + 14);
  } else {
    const text = label.classList.contains("show") && state !== "sleeping" ? label.textContent : "";
    measure.textContent = text;
    const pipsW = (pips.children.length ? pips.children.length * 12 + 6 : 0) + (waBtn.classList.contains("hidden") ? 0 : waBtn.offsetWidth + 10);
    // El texto ocupa lo que quepa (el resto se corta con "…"): la isla no pasa de MAX_W.
    const textW = text ? Math.min(measure.offsetWidth, 270, MAX_W - 116 - 12 - pipsW - 16) : 0;
    w = text || pipsW ? 116 + textW + (text ? 12 : 0) + pipsW + 16 : 150;
    h = BAR_H;
    if (state === "sleeping") { w = 132; h = 60; }
    root.classList.toggle("solo", !text && !pipsW);
  }
  const shrinking = w < lastSize.w - 1 || h < lastSize.h - 1;
  wrap.classList.toggle("closing", shrinking);
  if (open !== root.classList.contains("was-open")) (open ? SOUNDS.open : SOUNDS.close)();
  root.classList.toggle("was-open", open);
  wrap.style.setProperty("--w", `${Math.round(w)}px`);
  wrap.style.setProperty("--h", `${Math.round(h)}px`);
  lastSize = { w, h };
}
let layoutQueued = 0;
const relayout = () => { layoutQueued ||= requestAnimationFrame(layout); };
new MutationObserver(relayout).observe(content, { subtree: true, childList: true, attributes: true, attributeFilter: ["class"] });
new ResizeObserver(relayout).observe(content);

// --- Etiqueta: el texto viejo sube y se apaga mientras el nuevo entra desde abajo ---
const EASE_TICK = "cubic-bezier(.4, 0, .2, 1)";
function setLabel(text) {
  if (text === label.textContent) return;
  if (label.textContent && text && label.classList.contains("show")) {
    const ghost = label.cloneNode(true);
    ghost.removeAttribute("id");
    ghost.style.cssText = "color:#8f959e;background:none;animation:none";
    label.parentNode.append(ghost);
    ghost.animate([{ transform: "none", opacity: 1 }, { transform: "translate(-6px,-20px) scale(.9)", opacity: 0 }],
      { duration: 380, easing: EASE_TICK, fill: "forwards" }).onfinish = () => ghost.remove();
    label.animate([{ transform: "translateY(20px)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 380, easing: EASE_TICK });
  }
  label.textContent = text;
}

// --- Insignia: al cambiar de estado encoge (90 ms), cambia y vuelve con rebote (280 ms) ---
const BADGE_STATES = ["thinking", "working", "needs", "finished", "error"];
function swapBadge(prev, next) {
  if (!BADGE_STATES.includes(prev) || !BADGE_STATES.includes(next) || prev === next) return;
  badge.animate([{ transform: "scale(1)" }, { transform: "scale(0)", offset: .32 }, { transform: "scale(1.15)", offset: .8 }, { transform: "scale(1)" }],
    { duration: 380, easing: "ease-out" });
}

const SLEEP_AFTER = 120_000;
let state = "idle";
let backTimer, sleepTimer, labelTimer;

function setState(next, text = "", { back, labelFor } = {}) {
  const prev = state;
  state = next;
  Jarvis.setState(next);
  root.className = root.className.replace(/state-\w+/, "state-" + next);
  // El saltito y el temblor son de una sola vez: se reinician aunque el estado se repita.
  if (next === "finished" || next === "error") {
    const bob = document.getElementById("bob");
    bob.style.animation = "none"; void bob.getBBox(); bob.style.animation = "";
  }
  if (prev !== next) {
    swapBadge(prev, next);
    blink(); // un parpadeo tapa el cambio de cara
  }

  setLabel(text);
  label.classList.toggle("show", !!text);
  clearTimeout(labelTimer);
  if (text && labelFor) labelTimer = setTimeout(() => { label.classList.remove("show"); relayout(); }, labelFor);
  relayout();

  clearTimeout(backTimer);
  if (back) backTimer = setTimeout(settle, back);
  clearTimeout(sleepTimer);
  if (next === "idle") sleepTimer = setTimeout(() => setState("sleeping"), SLEEP_AFTER);
}

// --- Sonidos sintetizados (nada de archivos) ---
let muted = false;
let mini = false; // modo juego: chiquito en una esquina y sin sonido
// Sintetizador: ataque de 6 ms, caída exponencial, glide de tono, vibrato y un parcial
// "campana" opcional; todo pasa por un volumen maestro bajo y un poco de reverberación.
let audio, master;
let lastSoundAt = 0;
function audioOut() {
  lastSoundAt = performance.now();
  if (audio) {
    if (audio.state === "suspended") audio.resume();
    return master;
  }
  audio = new AudioContext();
  master = audio.createGain();
  master.gain.value = 0.12;
  const dry = audio.createGain();
  const wet = audio.createGain();
  wet.gain.value = 0.2;
  const verb = audio.createConvolver();
  // Respuesta al impulso generada: ruido que se apaga en 1,3 s.
  const len = Math.floor(audio.sampleRate * 1.3);
  const ir = audio.createBuffer(2, len, audio.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4);
  }
  verb.buffer = ir;
  master.connect(dry).connect(audio.destination);
  master.connect(verb).connect(wet).connect(audio.destination);
  return master;
}
function tone({ f, to, d = .15, type = "sine", g = .5, delay = 0, vib = 0, vibf = 6, h = 0 }) {
  if (muted || mini) return;
  const out = audioOut();
  const t = audio.currentTime + delay;
  const voice = (freq, gain, dur) => {
    const o = audio.createOscillator();
    const gn = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(freq * (to / f), t + dur * .9);
    if (vib) {
      const lfo = audio.createOscillator();
      const lg = audio.createGain();
      lfo.frequency.value = vibf;
      lg.gain.value = vib;
      lfo.connect(lg).connect(o.frequency);
      lfo.start(t);
      lfo.stop(t + dur);
    }
    gn.gain.setValueAtTime(.0001, t);
    gn.gain.exponentialRampToValueAtTime(gain, t + .006);
    gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn).connect(out);
    o.start(t);
    o.stop(t + dur + .02);
  };
  voice(f, g, d);
  if (h) voice(f * h, g * .3, d * .35); // parcial inarmónico: suena a campanita
}
// Whoosh: ruido filtrado con un barrido de frecuencia (abrir hacia arriba, cerrar hacia abajo).
function whoosh(from, to, d = .22, g = .18) {
  if (muted || mini) return;
  const out = audioOut();
  const t = audio.currentTime;
  const buf = audio.createBuffer(1, Math.floor(audio.sampleRate * d), audio.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource();
  const bp = audio.createBiquadFilter();
  const gn = audio.createGain();
  src.buffer = buf;
  bp.type = "bandpass";
  bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(from, t);
  bp.frequency.exponentialRampToValueAtTime(to, t + d);
  gn.gain.setValueAtTime(.0001, t);
  gn.gain.exponentialRampToValueAtTime(g, t + d * .3);
  gn.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(bp).connect(gn).connect(out);
  src.start(t);
}
// Gramática: éxito = acorde mayor que sube; error = dos notas que bajan; atención = misma nota
// con campana; micro-feedback = tonos cortos, agudos y casi inaudibles.
const SOUNDS = {
  hello: () => { tone({ f: 523, d: .14, g: .4 }); tone({ f: 784, d: .22, g: .4, delay: .085, h: 2.76 }); },
  finish: () => [523, 659, 784].forEach((f, i) => tone({ f, d: i === 2 ? .45 : .18, g: .45, delay: i * .085, h: i === 2 ? 2.76 : 0 })),
  needs: () => { tone({ f: 880, d: .16, type: "triangle", g: .45, h: 2.76 }); tone({ f: 880, d: .24, type: "triangle", g: .45, delay: .18, h: 2.76 }); },
  error: () => { tone({ f: 392, d: .2, type: "triangle", g: .5 }); tone({ f: 311, d: .42, type: "triangle", g: .5, delay: .17 }); },
  poke: () => tone({ f: 620, to: 980, d: .1, g: .25 }),
  greet: () => [523, 659, 784, 1047].forEach((f, i) => tone({ f, d: i === 3 ? .5 : .16, g: .4, delay: i * .085, h: i === 3 ? 2.76 : 0 })),
  love: () => [784, 988, 1175].forEach((f, i) => tone({ f, d: .2, g: .3, delay: i * .1, vib: i === 2 ? 8 : 0 })),
  dizzy: () => tone({ f: 700, to: 380, d: .7, type: "triangle", g: .35, vib: 40, vibf: 9 }),
  gulp: () => { tone({ f: 330, to: 160, d: .2, g: .6 }); tone({ f: 200, to: 120, d: .12, g: .3, delay: .16 }); },
  yawn: () => tone({ f: 420, to: 300, d: .9, g: .15, vib: 6, vibf: 5 }),
  hover: () => tone({ f: 2100, d: .05, g: .05 }),
  open: () => whoosh(500, 2400, .26, .14),
  close: () => whoosh(2200, 400, .22, .1),
};
// El audio se suspende tras unos segundos de silencio, para no gastar CPU.
setInterval(() => { if (audio?.state === "running" && performance.now() - lastSoundAt > 4000) audio.suspend(); }, 5000);

// --- Eventos de Claude Code ---
const TOOLS = { Bash: t("Ejecuta"), PowerShell: t("Ejecuta"), Read: t("Lee"), Write: t("Escribe"), Edit: t("Edita"),
  MultiEdit: t("Edita"), Glob: t("Busca"), Grep: t("Busca"), WebSearch: t("Busca en la web"), WebFetch: t("Abre"),
  Task: t("Agente"), Agent: t("Agente"), TodoWrite: t("Tareas"), NotebookEdit: "Notebook" };
const base = (p) => p.replace(/[\\/]+$/, "").split(/[\\/]/).pop();

function toolLabel(tool, input = {}) {
  const name = TOOLS[tool] ?? tool;
  const detail = input.command ?? (input.file_path && base(input.file_path)) ??
    (input.path && base(input.path)) ?? input.pattern ?? input.query ?? input.url ?? input.description;
  return detail ? `${name} · ${String(detail).slice(0, 60)}` : name;
}

// --- Varios chats a la vez: qué está haciendo cada uno ---
// main.js agrega p.title (el título del chat en la barra lateral de la app).
const sessions = new Map(); // session_id → { title, state, step, t }
const STALE_MS = 20 * 60_000;
const sessionBox = document.getElementById("sessions");

function track(p, st, step) {
  const id = p.session_id ?? p.title;
  if (!id) return;
  if (st === null) sessions.delete(id);
  else {
    const prev = sessions.get(id);
    sessions.set(id, { title: p.title || base(p.cwd ?? "") || "Claude", state: st, step: step ?? prev?.step ?? "",
      t: Date.now(), steps: prev?.steps ?? [], n: prev?.n ?? 0 });
    recordStep(sessions.get(id), p);
  }
  renderSessions();
  renderPips();
}
// Un puntito por chat activo en la barra de la isla (máx. 5), del color de su estado.
const STATE_COLOR = { working: "#4da3ff", thinking: "#9b87ff", needs: "#ffb020", finished: "#34c77b", error: "#e5484d", idle: "#6b717a" };
let lastPips = "";
function renderPips() {
  const list = liveSessions().slice(0, 5);
  const key = list.map((s) => s.title + s.state).join("|");
  if (key === lastPips) return; // sin cambios: no reiniciar sus animaciones
  lastPips = key;
  pips.replaceChildren(...list.map((s) => {
    const p = el("span", `pip ${s.state}`);
    p.style.setProperty("--c", STATE_COLOR[s.state] ?? "#888");
    p.title = `${s.title} · ${s.step}`;
    return p;
  }));
  relayout();
}
// Últimos 4 pasos de cada chat: { label, tool, input, out, status: run | ok | fail }
function recordStep(s, p) {
  const last = s.steps[s.steps.length - 1];
  switch (p.hook_event_name) {
    case "UserPromptSubmit":
      s.steps = [];
      s.n = 0;
      break;
    case "PreToolUse":
      if (last?.status === "run") last.status = "ok";
      s.n++;
      s.steps.push({ label: toolLabel(p.tool_name, p.tool_input), tool: p.tool_name, input: p.tool_input ?? {}, status: "run" });
      s.steps = s.steps.slice(-4);
      break;
    case "PostToolUse":
      if (last?.status === "run") { last.status = "ok"; last.out = p.tool_response; }
      break;
    case "PostToolUseFailure":
      if (last?.status === "run") { last.status = "fail"; last.out = p.tool_response ?? p.error; }
      break;
    case "Stop":
      if (last?.status === "run") last.status = "ok";
      break;
  }
  renderLive();
}

// --- Vista en vivo: el chat que más recientemente hizo algo ---
const liveBox = document.getElementById("live");
// Cuándo se abrió el resumen de WhatsApp (0 = cerrado). Al cerrarlo después de haberlo tenido
// a la vista al menos 2 s, cuenta como leído y esos mensajes no vuelven a salir.
let waOpenedAt = 0;
function waViewed() {
  const read = waOpenedAt && Date.now() - waOpenedAt > 2000 && whatsapp?.read && !whatsapp.busy && whatsapp.chats.length;
  waOpenedAt = 0;
  if (read) api.whatsappDismiss();
}
function hidePanel() {
  if (openApp === "wa") waViewed();
  sessionBox.classList.add("hidden");
  liveBox.classList.add("hidden");
  appsBox.classList.add("hidden");
  appView.classList.add("hidden");
  openApp = null;
}
const lines = (text, max) => String(text ?? "").replace(/\r/g, "").split("\n").slice(0, max);
function codeView(step) {
  const { tool, input = {}, out } = step;
  const view = el("div", "code");
  const tab = (name, note = "") => { const t = el("div", "tab", ""); t.append("📄 " + name, el("em", "", note)); view.append(t); };
  let i = 0;
  const add = (cls, text) => { const l = el("div", `ln ${cls}`, text || " "); if (cls === "add") l.style.setProperty("--i", i++); view.append(l); };
  if (tool === "Edit" || tool === "MultiEdit") {
    tab(base(input.file_path ?? ""), t("edita"));
    const edits = tool === "Edit" ? [input] : (input.edits ?? []).slice(0, 2);
    for (const e of edits) {
      lines(e.old_string, 3).forEach((t) => add("del", "- " + t));
      lines(e.new_string, 4).forEach((t) => add("add", "+ " + t));
    }
  } else if (tool === "Write") {
    tab(base(input.file_path ?? ""), t("nuevo"));
    lines(input.content, 6).forEach((t) => add("add", "+ " + t));
  } else if (tool === "Bash" || tool === "PowerShell") {
    add("cmd", "$ " + lines(input.command, 2).join(" "));
    const text = typeof out === "string" ? out : [out?.stdout, out?.stderr].filter(Boolean).join("\n");
    lines(text, 40).filter((t) => t.trim()).slice(-5).forEach((t) => add("out", t));
  } else return null;
  return view;
}
let liveKey = "";
function renderLive() {
  if (liveBox.classList.contains("hidden")) return;
  const s = liveSessions().find((x) => x.steps?.length);
  if (!s) return liveBox.classList.add("hidden");
  const cur = s.steps[s.steps.length - 1];
  // Solo se redibuja si cambió algo: así las animaciones de tecleo no se reinician solas.
  const key = s.title + s.state + s.n + s.steps.map((x) => x.status).join();
  if (key === liveKey) return;
  liveKey = key;
  const head = el("div", "lhead");
  head.append(el("span", `dot ${s.state}`), el("b", "", s.title), el("span", "sub", "Claude Code"),
    el("span", "count", s.state === "finished" ? t("listo") : t("paso {0}", s.n)));
  const steps = el("div", "steps");
  for (const st of s.steps) {
    const row = el("div", `lstep ${st.status}`);
    row.append(el("i"), el("span", "", st.label));
    steps.append(row);
  }
  liveBox.replaceChildren(head, steps, ...[codeView(cur)].filter(Boolean));
}
function showLive() {
  if (!liveSessions().some((x) => x.steps?.length)) return;
  liveKey = "";
  liveBox.classList.remove("hidden");
  renderLive();
}

function liveSessions() {
  const now = Date.now();
  for (const [id, s] of sessions) if (now - s.t > STALE_MS) sessions.delete(id);
  return [...sessions.values()].sort((a, b) => b.t - a.t);
}
// Tras un "¡Listo!" o un error, Nimbo vuelve a lo que esté haciendo otro chat (o descansa).
function settle() {
  const busy = liveSessions().find((s) => s.state === "working" || s.state === "thinking");
  if (busy) setState(busy.state, `${busy.title} · ${busy.step}`);
  else setState("idle");
}
const ago = (t) => {
  const s = Math.round((Date.now() - t) / 1000);
  return s < 60 ? `${s}s` : `${Math.round(s / 60)}m`;
};
function renderSessions() {
  renderApps();
  if (sessionBox.classList.contains("hidden")) return;
  const list = liveSessions();
  if (!list.length) { sessionBox.classList.add("hidden"); return; }
  const rows = list.map((s, i) => {
    const row = el("div", "srow");
    row.style.setProperty("--d", `${i * .035}s`); // entran escalonadas, 35 ms entre filas
    row.append(el("span", `dot ${s.state}`), el("b", "", s.title), el("span", "step", s.step), el("span", "ago", ago(s.t)));
    return row;
  });
  const head = list.length === 1 ? t("1 chat activo") : t("{0} chats activos", list.length);
  sessionBox.replaceChildren(el("div", "head", head), ...rows);
}

// --- Apps: píldoras (Chats, Trello, GitHub, WhatsApp, Pendientes) y la vista de cada una ---
// Al pasar el mouse solo sale la fila de píldoras, y solo las que tienen algo (cuenta > 0);
// el detalle de una se abre al tocarla, de a una. Así el panel nunca muestra todo a la vez.
const appsBox = document.getElementById("apps");
const appView = document.getElementById("appview");
let trelloData = null;
let trelloBusy = false;
let openApp = null; // la app cuya tarjeta está abierta
let lastApps = "";
const alertedCards = new Set();
const miniCloud = (color) => {
  const svgEl = document.createElementNS("http://www.w3.org/2000/svg", "svg");

function handle(p) {

  switch (p.hook_event_name) {
    case "SessionStart":
      track(p, "idle", t("empezó"));
      setState("idle", t("Hola 👋 · {0}", who), { labelFor: 3500 });
      SOUNDS.hello();
      break;
    case "UserPromptSubmit": {
      const asked = (p.prompt ?? t("Pensando…")).replace(/\s+/g, " ").slice(0, 70);
      track(p, "thinking", asked);
      setState("thinking", `${who} · ${asked}`);
      break;
    }
    case "PreToolUse": {
      const step = toolLabel(p.tool_name, p.tool_input);
      track(p, "working", step);
      setState("working", `${who} · ${step}`);
      break;
    }
    case "PostToolUse":
      track(p, "working");
      if (state !== "working") setState("working", label.textContent);
      break;
    case "PostToolUseFailure": {
      const step = t("⚠ Falló · {0}", toolLabel(p.tool_name, p.tool_input));
      track(p, "working", step);
      setState("working", `${who} · ${step}`);
      break;
    }
    case "Notification":
      // Permisos pendientes o "esperando tu respuesta": las dos cosas te necesitan.
      track(p, "needs", p.message ?? t("te necesita"));
      setState("needs", `${who}: ${p.message ?? t("te necesita")}`);
      SOUNDS.needs();
      break;
    case "Stop":
      track(p, "finished", t("terminó"));
      setState("finished", t("¡Listo! · {0}", who), { back: 5000 });
      SOUNDS.finish();
      break;
    case "StopFailure":
      track(p, "error", t("falló"));
      setState("error", t("Algo falló en {0} 😢", who), { back: 8000, labelFor: 2500 });
      SOUNDS.error();
      break;

api.onCursor(({ x, y }) => {
  const r = svg.getBoundingClientRect();
  const s = r.width / 240;
  const dx = x - (r.left + 120 * s);
  const dy = y - (r.top + 64 * s);
  if (lookOverride) return; // está mirando alrededor por su cuenta
  Jarvis.look(dx, dy);
  let lx = Math.tanh(dx / 260);
  let ly = Math.tanh(dy / 200);
  // Pensando: mira arriba a la derecha, con solo un 35 % de atención al cursor.
  if (state === "thinking") { lx = .35 * lx + .65 * .55; ly = .35 * ly - .65 * .55; }
  look.style.transform = `translate(${lx * 3.8}px,${ly * 3}px)`;
});

// "hoy 3:00 p. m.", "mañana 9:00 a. m.", "vie 3 oct, 9:00 a. m." o t("sin fecha")
function fmtDue(iso) {
  if (!iso) return t("sin fecha");
  const d = new Date(iso);
  const hour = d.toLocaleTimeString(LOCALE, { hour: "numeric", minute: "2-digit" });
  const day = (offset) => { const t = new Date(); t.setDate(t.getDate() + offset); return t.toDateString(); };
  if (d.toDateString() === day(0)) return t("hoy {0}", hour);
  if (d.toDateString() === day(1)) return t("mañana {0}", hour);
  return `${d.toLocaleDateString(LOCALE, { weekday: "short", day: "numeric", month: "short" })}, ${hour}`;
}

const MAX_IMAGE = 5 * 1024 * 1024; // límite de la API por imagen

function addFile(file) {

// Soltar archivos sobre Nimbo: abre la boca mientras pasan por encima y se los traga.
// Fin del arrastre por vigilante: mientras el archivo está encima llegan "dragover" cada
// pocos ms; si dejan de llegar (lo soltaste en otro lado, cancelaste o la ventana dejó de
// recibir el mouse al salir de la isla), Nimbo vuelve a la normalidad. Contar
// dragenter/dragleave fallaba: al salir de la isla Windows ya no avisa y quedaba trabado.
const charEl = document.getElementById("char");
let dragWatch = 0;
let swallowing = false;
function startDrop() {
  if (root.classList.contains("dropping")) return;
  hidePanel();
  root.classList.add("drag-over", "dropping");
  Jarvis.setLevel(0.6);
  relayout();
}
function endDrop() {
  clearTimeout(dragWatch);
  root.classList.remove("drag-over", "dropping");
  charEl.style.left = "";
  Jarvis.setLevel(0);
  lastSize = { w: 0, h: 0 };
  relayout();
}
function watchDrag() {
  clearTimeout(dragWatch);
  dragWatch = setTimeout(() => { if (!swallowing) endDrop(); }, 350);
}
document.addEventListener("dragenter", (e) => { e.preventDefault(); startDrop(); watchDrag(); });
// Mientras arrastras, el personaje grande sigue al cursor por la isla.
document.addEventListener("dragover", (e) => {
  e.preventDefault();
  startDrop();
  watchDrag();
  const w = wrap.getBoundingClientRect();
  const cw = charEl.offsetWidth;
  charEl.style.left = `${Math.max(8, Math.min(w.width - cw - 8, e.clientX - w.left - cw * .46))}px`;
});
document.addEventListener("drop", (e) => {
  e.preventDefault();
  clearTimeout(dragWatch);
  const dropped = [...(e.dataTransfer?.files ?? [])];
  if (!dropped.length) return endDrop();
  swallow(dropped, e.clientX, e.clientY);
});

// Cada archivo vuela de donde lo soltaste a la boca: primero se levanta un poco
// (anticipación) y luego acelera encogiéndose, como absorbido por un embudo.
function swallow(dropped, x, y) {
  swallowing = true;
  const c = charEl.getBoundingClientRect();
  const mx = c.left + c.width * .5;
  const my = c.top + c.height * .62;
  const flights = dropped.slice(0, 5).map((file, i) => {
    const f = el("div", "flyer");
    if (file.type.startsWith("image/")) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      f.append(img);
    } else f.append("📄");
    f.append(el("span", "", file.name));
    document.body.append(f);
    const { width: fw, height: fh } = f.getBoundingClientRect();
    const at = (px, py, sx, sy, r) => `translate(${px - fw / 2}px,${py - fh / 2}px) scale(${sx},${sy}) rotate(${r}deg)`;
    return f.animate([
      { transform: at(x, y, 1, 1, 0), opacity: 1 },
      { transform: at(x, y - 12, 1.08, 1.08, -4), opacity: 1, offset: .2 },
      { transform: at((x + mx) / 2, (y + my) / 2, .6, .45, 6), opacity: 1, offset: .7 },
      { transform: at(mx, my, .1, .05, 10), opacity: .2 },
    ], { duration: 560, delay: i * 90, easing: "cubic-bezier(.55,0,.85,.35)", fill: "forwards" }).finished.then(() => f.remove());
  });
  Promise.all(flights).then(() => {
    root.classList.remove("drag-over"); // cierra la boca: traga
    emote("gulp", 700);
    SOUNDS.gulp();
    setTimeout(() => { root.classList.add("chew"); setTimeout(() => root.classList.remove("chew"), 460); }, 380);
    // Después de masticar, la isla vuelve a su tamaño con el chat abierto y los adjuntos.
    setTimeout(() => {
      swallowing = false;
      endDrop();
      dropped.forEach(addFile);
      if (chat.classList.contains("hidden")) toggleChat(true);
      setState(state, dropped.length === 1 ? t("Me tragué \"{0}\" 📎", dropped[0].name) : t("Me tragué {0} archivos 📎", dropped.length), { labelFor: 2500 });
    }, 900);
  });
}

// --- Barra de progreso: rápida hasta el 60 %, lenta hasta el 92 %, y ahí espera la respuesta ---
const prog = document.getElementById("progress");
let progRaf = 0;
const eOut = (t) => 1 - Math.pow(1 - t, 3);
const eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function progressStart(expectedMs) {
  cancelAnimationFrame(progRaf);
  prog.classList.remove("done");
  prog.classList.add("on");
  const t0 = performance.now();
  const tick = () => {
    const u = (performance.now() - t0) / expectedMs;
    const p = u < .4 ? .6 * eOut(u / .4) : u < .85 ? .6 + .32 * eInOut((u - .4) / .45) : .92 + .05 * (1 - Math.exp(-(u - .85) * 2));
    prog.style.setProperty("--p", `${(p * 100).toFixed(1)}%`);
    progRaf = requestAnimationFrame(tick);
  };
  tick();
}
function progressEnd() {
  cancelAnimationFrame(progRaf);
  prog.style.setProperty("--p", "100%");
  prog.classList.add("done");
  setTimeout(() => prog.classList.remove("on"), 700);
  setTimeout(() => prog.classList.remove("done"), 1100);
}

// --- Voz: Nimbo dice su respuesta (main.js pide el audio con la voz del tema activo) ---
// Una voz a la vez. Se corta si llega otra respuesta, si empiezas a dictar (voice.js), si cambias
// de tema o si apagas la voz. Si no hay audio (voz apagada, sin internet…), no pasa nada.
let speaking = null; // { audio, url } de lo que suena ahora
let speakTurn = 0;
function stopSpeaking() {
  speakTurn++; // lo que venga en camino de una respuesta anterior ya no suena
  if (!speaking) return;
  speaking.audio.pause();
  URL.revokeObjectURL(speaking.url);
  speaking = null;
  Jarvis.setLevel(0);
}
async function speak(text) {
  stopSpeaking();
  const turn = speakTurn;
  if (!text || mini) return;
  const bytes = await api.tts(text).catch(() => null);
  if (!bytes || turn !== speakTurn) return;
  const url = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
  const audio = new Audio(url);
  speaking = { audio, url };
  const done = () => { if (speaking?.audio === audio) stopSpeaking(); };
  audio.onended = done;
  audio.onerror = done;
  audio.onplaying = () => Jarvis.setLevel(0.45); // la esfera crece mientras habla
  audio.play().catch(done);
}
api.onVoice((on) => { if (!on) stopSpeaking(); });

async function askAndShow(message) {
  stopSpeaking(); // pregunta nueva: se calla lo anterior
  answer.replaceChildren(el("div", "", t("Pensando…")));
  answer.classList.add("wait");
  answerBox.classList.remove("hidden");
  progressStart(message.files?.length || message.images?.length ? 25_000 : 15_000);
  const r = await api.ask(message);
  progressEnd();
  if (r?.added?.length) setTimeout(() => setState(state, `⏰ Anotado: ${r.added[0].text}`, { labelFor: 3500 }), 300);
  answer.classList.remove("wait");
  answer.replaceChildren(el("div", "reply", r?.text ?? t("No pude hablar con Claude.")));
  speak(r?.text); // solo la respuesta corta; los prompts propuestos para otros chats no se leen
  for (const d of r?.dispatch ?? []) answer.append(proposal(d));
  answer.scrollTop = 0;
  return r;
}

// --- Orquestador: Nimbo propone un prompt para otro chat; tú lo revisas y lo envías ---
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function proposal(d) {
  const box = el("div", "prop");
  const head = el("div", "what", `→ ${d.project}${d.title ? " · " + d.title : ""}`);
  if (d.active) head.append(el("span", "warn", t("  ⚠ abierto en la app: ahí no verás esto hasta reabrirlo")));
  const prompt = el("textarea");
  prompt.value = d.prompt;
  const send = el("button", "allow", t("Enviar"));
  const drop = el("button", "", t("Descartar"));
  const btns = el("div", "btns");
  btns.append(send, drop);
  box.append(head, prompt, btns);

  drop.onclick = () => box.remove();
  send.onclick = async () => {
    // Mientras el otro chat trabaja se esconde el texto; el progreso va en la etiqueta
    // (los hooks de ese chat también mueven a Nimbo: "Ejecuta · git push", etc.).
    const text = prompt.value;
    box.classList.add("hidden");
    answer.querySelector(".reply")?.classList.add("hidden");
    if (!answer.querySelector(".prop:not(.hidden)")) answerBox.classList.add("hidden");
    setState("working", t("→ {0} trabajando…", d.project));

    progressStart(60_000);
    const res = await api.dispatch(d.session, text);
    progressEnd();
    box.replaceChildren(el("div", "done", `✓ ${res?.project ?? d.project}: ${res?.text ?? t("(sin respuesta)")}`));
    box.classList.remove("hidden");
    answerBox.classList.remove("hidden");
    setState("finished", t("¡Listo! · {0}", d.project), { back: 5000 });
    SOUNDS.finish();
  };
  return box;
}

// Posición a lo largo del borde superior (la guarda main.js)
api.onAnchor((f) => root.style.setProperty("--f", f));

// --- Arrastrar a Nimbo por el borde de arriba ---
// Se agarra de la barra de la isla. Menos de 6 px de movimiento sigue siendo un clic.
// Mientras se mueve: se inclina hacia atrás según la velocidad y deja una estela; al
// soltarlo aterriza con un rebote.
let dragDown = null; // { x, id } desde que se presiona
let dragging = false;
let suppressClick = false;
let lean = 0, leanTarget = 0, leanRaf = 0, lastDragX = 0;
const islandEl = document.getElementById("island");
function leanLoop() {
  lean += (leanTarget - lean) * .22;
  leanTarget *= .86; // sin movimiento vuelve a enderezarse
  charEl.style.setProperty("--lean", `${lean.toFixed(2)}deg`);
  islandEl.style.setProperty("--trail", Math.min(Math.abs(lean) / 10, 1).toFixed(2));
  islandEl.style.setProperty("--trail-dir", lean > 0 ? "90deg" : "270deg");
  Jarvis.look(-lean * 40, 0);
  leanRaf = dragging ? requestAnimationFrame(leanLoop) : 0;
}
wrap.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || mini || e.target.closest("#content")) return;
  dragDown = { x: e.screenX, id: e.pointerId };
});
wrap.addEventListener("pointermove", (e) => {
  if (!dragDown) return;
  // Si llega un movimiento sin botón presionado, es que la suelta se perdió: terminar.
  if (e.buttons === 0) return endDrag();
  if (!dragging && Math.abs(e.screenX - dragDown.x) > 6) {
    dragging = true;
    wrap.setPointerCapture(dragDown.id);
    root.classList.add("dragging");
    hidePanel();
    api.dragStart({ w: wrap.offsetWidth, grab: e.clientX - wrap.getBoundingClientRect().left });
    SOUNDS.open();
    islandEl.animate([{ transform: "scale(1)" }, { transform: "scale(1.05, .94)" }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
    lastDragX = e.screenX;
    leanLoop();
  }
  if (dragging) {
    // Se inclina en contra del movimiento, como si lo llevaras colgando.
    leanTarget = Math.max(-16, Math.min(16, (e.screenX - lastDragX) * 1.3));
    lastDragX = e.screenX;
  }
});
function endDrag() {
  if (dragging) {
    dragging = false;
    suppressClick = true; // el clic que llega tras soltar no debe abrir el chat
    setTimeout(() => (suppressClick = false), 250);
    api.dragEnd();
    root.classList.remove("dragging");
    charEl.style.removeProperty("--lean");
    lastSize = { w: 0, h: 0 };
    relayout();
    // Aterrizaje: se aplasta contra el borde y rebota.
    islandEl.animate([{ transform: "scale(1.07, .88)" }, { transform: "scale(.97, 1.06)" }, { transform: "scale(1.01, .99)" }, { transform: "scale(1)" }],
      { duration: 420, easing: "cubic-bezier(.3, 1.4, .5, 1)" });
    SOUNDS.close();
    emote("hello", 900);
  }
  dragDown = null;
}
// La suelta se escucha por varios caminos: mientras la ventana se mueve bajo el cursor, el
// evento puede llegar a otro elemento o perderse, y Nimbo no debe quedar pegado al mouse.
for (const type of ["pointerup", "pointercancel", "mouseup"]) document.addEventListener(type, endDrag, true);
wrap.addEventListener("lostpointercapture", endDrag);
window.addEventListener("blur", endDrag);
api.onDragAbort(endDrag);

api.onTheme((t) => {
  stopSpeaking(); // cada tema tiene su voz: lo que sonaba era la del otro
  const jarvis = t === "jarvis";
  root.classList.toggle("theme-jarvis", jarvis);
  root.classList.toggle("theme-cloud", !jarvis);
  Jarvis.setActive(jarvis);
});

// Entrada: baja desde arriba con un rebote y saluda.
let NAME = ""; // tu nombre para el saludo (prefs.json → "name")
api.onName((n) => { NAME = n; });
setTimeout(() => root.classList.remove("enter"), 60);
setState("idle");
setTimeout(() => {
  const h = new Date().getHours();
  const hi = h < 12 ? t("Buenos días") : h < 19 ? t("Buenas tardes") : t("Buenas noches");
  emote("hello", 1600);
  SOUNDS.greet();
  setState("idle", NAME ? `${hi}, ${NAME} 👋` : `${hi} 👋`, { labelFor: 3500 });
}, 900);
</script>
<script src="voice.js"></script>
</body>
</html>
