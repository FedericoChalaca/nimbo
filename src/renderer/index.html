<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nimbo</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; media-src 'self' blob: mediastream:; connect-src 'self' blob: https://huggingface.co https://*.huggingface.co https://*.hf.co">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Mini nube con ojitos: se pinta del color de cada app (currentColor) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="mini" viewBox="0 0 40 28">
    <circle cx="13" cy="16" r="8" fill="currentColor"/><circle cx="21" cy="11" r="10" fill="currentColor"/>
    <circle cx="29" cy="16" r="7" fill="currentColor"/><rect x="7" y="14" width="27" height="10" rx="5" fill="currentColor"/>
    <circle cx="17" cy="16.5" r="1.7" fill="#14151a"/><circle cx="25" cy="16.5" r="1.7" fill="#14151a"/>
  </symbol>
</svg>
<div id="nimbo" class="enter state-idle theme-cloud">
  <div id="wrap" class="solid">
    <div class="ear l"></div><div class="ear r"></div>
    <div id="island">
      <div id="dropzone"></div>
      <div id="char">
        <div id="glow"></div>
        <svg viewBox="0 0 240 140">
          <defs>
            <linearGradient id="cloudShade" x1="0" y1="0" x2=".25" y2="1">
              <stop class="top" offset=".25"/><stop class="bottom" offset="1"/>
            </linearGradient>
            <radialGradient id="cloudGloss">
              <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g id="bob"><g id="breathe"><g id="squish">
            <g id="body">
              <circle cx="88" cy="62" r="26"/>
              <circle cx="120" cy="48" r="34"/>
              <circle cx="154" cy="60" r="24"/>
              <rect x="64" y="54" width="114" height="42" rx="21"/>
            </g>
            <ellipse id="gloss" cx="106" cy="34" rx="24" ry="11"/>
            <g class="face">
              <ellipse class="cheek" cx="96" cy="77" rx="6" ry="3.6"/>
              <ellipse class="cheek" cx="144" cy="77" rx="6" ry="3.6"/>
              <g class="v brows-focus"><path class="line" d="M100,54 l11,1.5"/><path class="line" d="M140,54 l-11,1.5"/></g>
              <g id="look"><g id="eyesScale">
                <g class="v eyes-open">
                  <g class="eye"><ellipse cx="106" cy="64" rx="5.5" ry="7.5" fill="var(--ink)"/><circle cx="107.8" cy="61" r="1.8" fill="#fff"/></g>
                  <g class="eye"><ellipse cx="134" cy="64" rx="5.5" ry="7.5" fill="var(--ink)"/><circle cx="135.8" cy="61" r="1.8" fill="#fff"/></g>
                </g>
                <g class="v eyes-happy"><path class="line" d="M100,66 q6,-8 12,0"/><path class="line" d="M128,66 q6,-8 12,0"/></g>
                <g class="v eyes-closed"><path class="line" d="M100,64 q6,4 12,0"/><path class="line" d="M128,64 q6,4 12,0"/></g>
                <g class="v eyes-x"><path class="line" d="M102,60 l8,8 M110,60 l-8,8"/><path class="line" d="M130,60 l8,8 M138,60 l-8,8"/></g>
                <g class="v eyes-dizzy">
                  <path class="line spin" d="M106,64 m0,-1 a1,1 0 1,1 -1,1 a2.5,2.5 0 1,1 2.5,2.5 a4,4 0 1,1 -4,-4"/>
                  <path class="line spin" d="M134,64 m0,-1 a1,1 0 1,1 -1,1 a2.5,2.5 0 1,1 2.5,2.5 a4,4 0 1,1 -4,-4"/>
                </g>
              </g></g>
              <path class="v line m-smile" d="M113,76 q7,7 14,0"/>
              <path class="v line m-flat" d="M115,79 h10"/>
              <path class="v line m-sad" d="M113,82 q7,-6 14,0"/>
              <path class="v m-big" d="M110,75 q10,13 20,0 z" fill="var(--ink)"/>
              <ellipse class="v m-o" cx="120" cy="79" rx="3" ry="3.6" fill="var(--ink)"/>
              <ellipse class="v m-small" cx="120" cy="78" rx="2" ry="2.4" fill="var(--ink)"/>
            </g>
          </g></g></g>
          <g class="v dots"><circle cx="180" cy="28" r="3"/><circle cx="190" cy="19" r="4"/><circle cx="203" cy="11" r="5"/></g>
          <g class="v sparkles">
            <path d="M52,30 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3z"/>
            <path d="M186,22 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5z"/>
            <path d="M58,92 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z"/>
            <path d="M190,86 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5z"/>
          </g>
          <g class="v rain"><line x1="92" y1="100" x2="90" y2="107"/><line x1="112" y1="102" x2="110" y2="109"/>
            <line x1="132" y1="100" x2="130" y2="107"/><line x1="150" y1="102" x2="148" y2="109"/></g>
          <g class="v zzz"><text x="182" y="82">z</text><text x="182" y="82">z</text><text x="182" y="82">z</text></g>
          <g class="v hearts">
            <path d="M180,36 c-6,-5 -10,-8 -10,-12 a5,5 0 0,1 10,-2 a5,5 0 0,1 10,2 c0,4 -4,7 -10,12z"/>
            <path d="M62,40 c-4,-3.5 -7,-5.5 -7,-8.5 a3.5,3.5 0 0,1 7,-1.4 a3.5,3.5 0 0,1 7,1.4 c0,3 -3,5 -7,8.5z"/>
            <path d="M200,58 c-3,-2.5 -5,-4 -5,-6 a2.5,2.5 0 0,1 5,-1 a2.5,2.5 0 0,1 5,1 c0,2 -2,3.5 -5,6z"/>
          </g>
          <rect id="hit" x="60" y="12" width="122" height="88" rx="30" fill="transparent"/>
        </svg>
        <canvas id="orb"></canvas>
        <div id="badge"></div>
      </div>
      <div id="bar">
        <div id="ticker"><span id="label"></span></div>
        <button id="mailBtn" class="hidden" type="button" title="Revisar correo">✉</button>
        <button id="waBtn" class="hidden" type="button" title="Resumen de WhatsApp"></button>
        <div id="tasks"></div>
        <div id="pips"></div>
        <button id="menuBtn" type="button" title="Opciones de Nimbo">⋮</button>
        <div id="progress"><i></i></div>
      </div>
      <div id="content">
        <div id="setup" class="box hidden"></div>
        <div id="remind" class="box hidden">
          <div class="what">Recordatorio</div>
          <div class="rtext"></div>
          <div class="rdue"></div>
          <div class="btns">
            <button data-r="snooze">Posponer 10 min</button>
            <button class="allow" data-r="done">Hecho</button>
          </div>
        </div>
        <div id="taskBox" class="box hidden"></div>
        <div id="apps" class="box hidden"></div>
        <div id="live" class="box hidden"></div>
        <div id="sessions" class="box hidden"></div>
        <div id="appview" class="box hidden"></div>
        <div id="card" class="box hidden">
          <div class="what"></div>
          <div class="cmd"></div>
          <div id="alwaysRules" class="hidden"></div>
          <div class="btns">
            <button data-d="deny">Denegar</button>
            <button data-d="" title="Que te pregunte en la terminal">Terminal</button>
            <button id="always" class="hidden" data-d="always">Siempre</button>
            <button class="allow" data-d="allow">Permitir</button>
          </div>
        </div>
        <form id="chat" class="box hidden">
          <div id="slash" class="hidden"></div>
          <div id="thumbs"></div>
          <select id="ai" class="hidden" title="IA"></select>
          <input id="msg" placeholder="Escríbele a Claude… o / para comandos" autocomplete="off">
          <input id="file" type="file" multiple hidden>
          <button type="button" id="shot" class="ico" title="Ver mi pantalla: toma un pantallazo y lo adjunta"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4"/></svg></button>
          <button type="button" id="attach" class="ico" title="Adjuntar archivos o imágenes"><svg viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></button>
          <button type="button" id="mic" class="ico" title="Dictar: habla y se escribe aquí"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
          <button type="submit" class="ico send" title="Enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </form>
        <div id="answerBox" class="box hidden">
          <div id="answer"></div>
          <div id="rail"><div id="thumb"></div></div>
        </div>
      </div>
    </div>
  </div>
  <span id="measure"></span>
</div>

<script src="jarvis.js"></script>
<script src="../shared/i18n.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
</body>
</html>
